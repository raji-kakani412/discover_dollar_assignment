version: "3.8"

services:

  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    
    image: rajikakani412/backend:v1
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/dd_db
    depends_on:
      - mongodb

  frontend:
    
    image: rajikakani412/frontend:v1
    container_name: frontend
    restart: always
    ports:
    - "8081:80"
    depends_on:
      - backend

volumes:
  mongo-data: